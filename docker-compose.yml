services:
  frontend:
    build:
      context: .
      args:
        VITE_SITE_URL: ${SITE_URL:-http://localhost}
        VITE_USE_MOCKS: ${USE_MOCKS:-true}
    ports:
      - "0.0.0.0:${PORT:-80}:8080"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    restart: unless-stopped
