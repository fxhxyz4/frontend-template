<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>AntiCorruption AI</title>
    <meta
      name="description"
      content="ШІ-асистент з антикорупційного законодавства України: пошук норм, аналіз документів на корупційні ризики."
    />
    <meta
      name="robots"
      content="index, follow"
    />
    <link
      rel="canonical"
      href="%VITE_SITE_URL%/"
    />
    <meta
      name="color-scheme"
      content="light dark"
    />
    <meta
      name="theme-color"
      content="#f5f6f7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#151618"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="32x32"
    />
    <link
      rel="icon"
      href="/favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />
    <link
      rel="manifest"
      href="/site.webmanifest"
    />
    <meta
      property="og:type"
      content="website"
    />
    <meta
      property="og:site_name"
      content="AntiCorruption AI"
    />
    <meta
      property="og:locale"
      content="uk_UA"
    />
    <meta
      property="og:title"
      content="AntiCorruption AI"
    />
    <meta
      property="og:description"
      content="ШІ-асистент з антикорупційного законодавства України: пошук норм, аналіз документів на корупційні ризики."
    />
    <meta
      property="og:url"
      content="%VITE_SITE_URL%/"
    />
    <meta
      property="og:image"
      content="%VITE_SITE_URL%/og-image.png"
    />
    <meta
      property="og:image:width"
      content="1200"
    />
    <meta
      property="og:image:height"
      content="630"
    />
    <meta
      property="og:image:alt"
      content="AntiCorruption AI — ШІ-асистент з антикорупційного законодавства"
    />
    <meta
      name="twitter:card"
      content="summary_large_image"
    />
    <meta
      name="twitter:title"
      content="AntiCorruption AI"
    />
    <meta
      name="twitter:description"
      content="ШІ-асистент з антикорупційного законодавства України."
    />
    <meta
      name="twitter:image"
      content="%VITE_SITE_URL%/og-image.png"
    />

    <script>
      try {
        var d = document.documentElement
        var s = localStorage.getItem("mantine-color-scheme-value") || "auto"
        if (s === "auto") s = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        d.setAttribute("data-mantine-color-scheme", s)
        d.setAttribute("data-app-preset", localStorage.getItem("app-theme-preset") || "pastel")
      } catch (e) {}
    </script>
    <style>
      html {
        background: #f5f6f7;
      }
      html[data-mantine-color-scheme="dark"] {
        background: #151618;
      }
      html[data-app-preset="sapphire"] {
        background: #f6f8fc;
      }
      html[data-app-preset="sapphire"][data-mantine-color-scheme="dark"] {
        background: #141b2b;
      }
      html[data-app-preset="gradient"] {
        background: linear-gradient(160deg, #d8eef6, #e6e2f8 35%, #f7e3ec 65%, #faf1d6) fixed;
      }
      html[data-app-preset="gradient"][data-mantine-color-scheme="dark"] {
        background: #151618;
      }
    </style>
  </head>
  <body>
    <noscript>Для роботи застосунку потрібен JavaScript.</noscript>
    <div id="root"></div>
    <script
      type="module"
      src="./src/main.tsx"
    ></script>
  </body>
</html>
